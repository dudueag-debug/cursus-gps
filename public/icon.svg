<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050B14" />
      <stop offset="50%" stop-color="#0A1128" />
      <stop offset="100%" stop-color="#001845" />
    </linearGradient>
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="500" height="500" x="6" y="6" rx="106" fill="none" stroke="#23334D" stroke-width="6" />

  <!-- Road perspective lines -->
  <polygon points="256,120 370,430 142,430" fill="#0A1832" opacity="0.9" />
  <line x1="256" y1="180" x2="256" y2="430" stroke="#CCFF00" stroke-width="12" stroke-dasharray="32,24" stroke-linecap="round" filter="url(#neonGlow)" />

  <!-- Moving vehicle navigation arrow / compass -->
  <g transform="translate(256, 230) scale(1.6)" filter="url(#neonGlow)">
    <polygon points="0,-48 38,40 0,22 -38,40" fill="#CCFF00" stroke="#FFFFFF" stroke-width="3" />
    <polygon points="0,-48 0,22 -38,40" fill="#A6D900" />
  </g>

  <!-- Wind streaks -->
  <path d="M 120 280 Q 200 270 230 310" stroke="#00D2FF" stroke-width="6" fill="none" opacity="0.7" stroke-linecap="round" />
  <path d="M 390 300 Q 310 290 280 330" stroke="#00D2FF" stroke-width="6" fill="none" opacity="0.7" stroke-linecap="round" />

  <!-- Cursus Badge -->
  <rect x="186" y="56" width="140" height="34" rx="17" fill="#0A1128" stroke="#0066FF" stroke-width="2.5" />
  <text x="256" y="78" fill="#00D2FF" font-family="-apple-system, system-ui, sans-serif" font-weight="900" font-size="16" letter-spacing="3" text-anchor="middle">CURSUS</text>

  <!-- Brand Title -->
  <text x="256" y="475" fill="#FFFFFF" font-family="-apple-system, system-ui, sans-serif" font-weight="900" font-size="34" letter-spacing="1" text-anchor="middle">TÔ PASSANDO</text>
</svg>
