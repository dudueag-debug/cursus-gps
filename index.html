<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#050B14" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TÔ PASSANDO" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="description" content="TÔ PASSANDO - GPS Inteligente, Colaborativo e Multimodal da plataforma CURSUS. Você vai. A gente te guia." />
    <title>TÔ PASSANDO - GPS do CURSUS | Você vai. A gente te guia.</title>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-blue-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('[PWA] Service Worker registrado com sucesso:', reg.scope))
            .catch(err => console.log('[PWA] Falha ao registrar Service Worker:', err));
        });
      }
    </script>
  </body>
</html>
